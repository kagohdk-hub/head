<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>到達ステータス・ネットワーク</title>
<style>
  :root{
    --bg: #211D1A;
    --bg-grid: #262019;
    --panel: #2A2521;
    --panel-border: #3A332C;
    --line: #55483C;
    --line-dim: #3A332C;
    --text: #EDE6DB;
    --text-dim: #96897A;
    --text-faint: #5E5347;
    --achieved: #5B8A76;
    --achieved-dim: #35473E;
    --wip: #D8A34C;
    --wip-dim: #4A3F27;
    --target: #6E93B8;
    --target-dim: #2E3C48;
    --locked: #4A433C;
    --goal-ring: #E4C25E;
    --danger: #C06A5A;
    --mono: ui-monospace, "SF Mono", Consolas, Menlo, monospace;
    --sans: -apple-system, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
  }
  #app{ display:flex; width:100%; height:100vh; }

  /* ---------- グラフ領域 ---------- */
  #graph-wrap{
    position:relative;
    flex: 1 1 auto;
    min-width: 0;
    background:
      radial-gradient(circle at 1px 1px, var(--bg-grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--bg);
    overflow: hidden;
    cursor: grab;
  }
  #graph-wrap.dragging{ cursor: grabbing; }
  #graph-svg{ display:block; width:100%; height:100%; }

  .edge{ fill:none; stroke: var(--line); stroke-width: 1.6; opacity: 0.55; transition: opacity .15s, stroke .15s; }
  .edge.or{ stroke-dasharray: 2 5; }
  .edge.dim{ opacity: 0.08; }
  .edge.lit{ opacity: 0.95; stroke: var(--text-dim); }
  .edge.selected{ stroke: var(--danger); opacity: 1; stroke-width: 2.4; }
  .edge-hit{ fill:none; stroke: transparent; stroke-width: 16; cursor: pointer; }
  .connect-preview{ fill:none; stroke: var(--goal-ring); stroke-width: 1.6; stroke-dasharray: 3 4; opacity: 0.85; pointer-events: none; }

  .node{ cursor:grab; }
  .node:active{ cursor:grabbing; }
  .node .halo{ opacity:0; transition: opacity .15s; }
  .node.selected .halo{ opacity:1; }
  .node-circle{ stroke-width: 2; transition: stroke-width .15s, opacity .15s; }
  .node.dim .node-circle, .node.dim .node-label{ opacity: 0.16; }
  .node.dim .goal-ring{ opacity: 0.16; }
  .node-label{
    font-family: var(--sans);
    font-size: 12.5px;
    fill: var(--text);
    text-anchor: middle;
    pointer-events: none;
    transition: opacity .15s;
  }
  .node-sub{
    font-family: var(--mono);
    font-size: 9px;
    fill: var(--text-faint);
    text-anchor: middle;
    pointer-events: none;
    letter-spacing: 0.03em;
  }
  .goal-ring{ fill:none; stroke: var(--goal-ring); stroke-width: 1.4; stroke-dasharray: 1.5 3.5; }

  /* ---------- 上部ツールバー ---------- */
  #toolbar{
    position:absolute; top:14px; left:14px; right:14px;
    display:flex; align-items:center; gap:10px;
    pointer-events:none;
    z-index: 5;
  }
  #title{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    pointer-events:none;
  }
  .spacer{ flex:1; }
  .btn{
    pointer-events:auto;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    font-family: var(--sans);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .btn:hover{ border-color: var(--text-faint); color: var(--text); }

  /* ---------- 凡例 ---------- */
  #legend{
    position:absolute; left:14px; bottom:14px;
    display:flex; flex-direction:column; gap:6px;
    background: var(--panel);
    border:1px solid var(--panel-border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11.5px;
    color: var(--text-dim);
    pointer-events:none;
  }
  .legend-row{ display:flex; align-items:center; gap:8px; }
  .legend-dot{ width:10px; height:10px; border-radius:50%; border:2px solid; flex:0 0 auto; }
  .legend-line{ width:18px; height:0; border-top:1.6px solid var(--line); flex:0 0 auto; }
  .legend-line.or{ border-top-style:dashed; }

  /* ---------- サイドパネル ---------- */
  #panel{
    flex: 0 0 300px;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    padding: 20px;
    overflow-y: auto;
    display:flex; flex-direction:column; gap:16px;
  }
  #panel h2{ font-size:15px; margin:0 0 2px; font-weight:600; }
  #label-input{
    width:100%; background:#1B1713; color: var(--text); border:1px solid var(--panel-border);
    border-radius:6px; padding:8px 10px; font-size:14px; font-family: var(--sans);
  }
  #label-input:focus{ outline:none; border-color: var(--text-faint); }
  #panel .empty{ color: var(--text-faint); font-size:13px; line-height:1.7; }
  .field-label{ font-family: var(--mono); font-size:10px; color: var(--text-faint); letter-spacing:0.06em; margin-bottom:6px; }
  .status-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:6px; }
  .status-btn{
    border:1px solid var(--panel-border); background: transparent; color: var(--text-dim);
    font-family: var(--sans); font-size:12px; padding:8px 6px; border-radius:6px; cursor:pointer;
    display:flex; align-items:center; gap:6px; justify-content:center;
    transition: all .12s;
  }
  .status-btn .dot{ width:8px; height:8px; border-radius:50%; border:2px solid; }
  .status-btn.active{ color: var(--text); border-color: var(--text-faint); background: rgba(255,255,255,0.03); }
  .goal-toggle{
    border:1px solid var(--panel-border); background: transparent; color: var(--text-dim);
    font-family: var(--sans); font-size:12px; padding:8px 10px; border-radius:6px; cursor:pointer;
    text-align:left;
  }
  .goal-toggle.active{ color: var(--goal-ring); border-color: var(--goal-ring); }
  .req-list{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; }
  .req-group{ padding:8px 10px; background: rgba(255,255,255,0.02); border:1px solid var(--panel-border); border-radius:6px; }
  .req-group .or-label{ font-family: var(--mono); font-size:9.5px; color: var(--text-faint); margin-bottom:4px; }
  .req-item{ display:flex; align-items:center; gap:6px; padding:2px 0; }
  .req-item .dot{ width:7px; height:7px; border-radius:50%; border:1.5px solid; flex:0 0 auto; }
  .unlocks-list{ display:flex; flex-direction:column; gap:4px; font-size:12.5px; color: var(--text-dim); }
  .unlocks-list div{ cursor:pointer; }
  .unlocks-list div:hover{ color: var(--text); }
  #json-editor{
    width:100%; height: 220px; background:#1B1713; color: var(--text);
    font-family: var(--mono); font-size:11.5px; border:1px solid var(--panel-border); border-radius:6px;
    padding:10px; resize: vertical;
  }
  #json-msg{ font-size:11px; color: var(--text-faint); min-height: 14px; }
  #json-msg.error{ color: var(--danger); }
  #edit-actions{ display:flex; gap:8px; }
</style>
</head>
<body>
<div id="app">
  <div id="graph-wrap">
    <svg id="graph-svg"></svg>
    <div id="toolbar">
      <div id="title">STATUS NETWORK</div>
      <div class="spacer"></div>
      <button class="btn" id="btn-recompute">配置を再計算</button>
      <button class="btn" id="btn-import">読み込み</button>
      <button class="btn" id="btn-export">書き出し</button>
      <button class="btn" id="btn-edit">データを編集</button>
      <button class="btn" id="btn-reset">例をリセット</button>
      <input type="file" id="file-input" accept="application/json,.json" style="display:none;">
    </div>
    <div id="legend">
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--locked); background:transparent;"></span>未着手</div>
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--target); background:transparent;"></span>次に到達できる場所</div>
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--wip); background:var(--wip-dim);"></span>今取り組み中</div>
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--achieved); background:var(--achieved-dim);"></span>到達済み</div>
      <div class="legend-row"><span class="legend-line"></span>AND(すべて必要)</div>
      <div class="legend-row"><span class="legend-line or"></span>OR(いずれかでよい)</div>
      <div style="height:1px; background:var(--panel-border); margin:2px 0;"></div>
      <div class="legend-row" style="font-family:var(--mono); font-size:10px;">空クリック:追加</div>
      <div class="legend-row" style="font-family:var(--mono); font-size:10px;">ドラッグ:移動</div>
      <div class="legend-row" style="font-family:var(--mono); font-size:10px;">Shift+ドラッグ:接続</div>
      <div class="legend-row" style="font-family:var(--mono); font-size:10px;">選択してDelete:削除</div>
    </div>
  </div>
  <div id="panel">
    <div id="panel-content">
      <div class="empty">ノードをクリックすると詳細が表示されます。ステータスの変更や、ゴール指定もここから行えます。</div>
    </div>
  </div>
</div>

<script>
(function(){

const STORAGE_KEY = 'goal-network-data';

const DEFAULT_DATA = {
  nodes: [
    { id:'ingredients', label:'材料がある', status:'achieved', requires:[] },
    { id:'tools',       label:'調理器具がある', status:'achieved', requires:[] },
    { id:'money',       label:'手持ちのお金がある', status:'achieved', requires:[] },
    { id:'can_cook',    label:'カレーを作れる', status:'wip', requires:[['ingredients','tools']] },
    { id:'can_go_shop', label:'カレー屋に行ける', status:'achieved', requires:[['money']] },
    { id:'can_eat',     label:'カレーを食べられる', status:'target', requires:[['can_cook'],['can_go_shop']], isGoal:true }
  ]
};

const STATUS_ORDER = ['locked','target','wip','achieved'];
const STATUS_LABEL = { locked:'未着手', target:'到達できる', wip:'取り組み中', achieved:'到達済み' };
const STATUS_COLOR_VAR = { locked:'--locked', target:'--target', wip:'--wip', achieved:'--achieved' };
const STATUS_FILL_VAR  = { locked:null, target:null, wip:'--wip-dim', achieved:'--achieved-dim' };

let data = null;
let selectedId = null;
let pan = {x:0, y:0};
let zoom = 1;

const svg = document.getElementById('graph-svg');
const panelContent = document.getElementById('panel-content');
const graphWrap = document.getElementById('graph-wrap');

// ---------- 永続化 ----------
const CANVAS_SIZE = 2400;
const NODE_RADIUS = 22;

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY);
    if(res && res.value){
      data = JSON.parse(res.value);
      return;
    }
  }catch(e){ /* not found or storage unavailable */ }
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
}

let saveTimer = null;
function saveData(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set(STORAGE_KEY, JSON.stringify(data)); }
    catch(e){ console.warn('save failed', e); }
  }, 250);
}

// ---------- 自動配置(中心放射状)。手動配置がない場合のみ、または再計算時に使用 ----------
function computeAutoPositions(){
  const nodesById = {};
  data.nodes.forEach(n => nodesById[n.id] = n);

  const layerCache = {};
  const visiting = new Set();
  function getLayer(id){
    if(layerCache[id] !== undefined) return layerCache[id];
    if(visiting.has(id)) return 0;
    visiting.add(id);
    const n = nodesById[id];
    let layer = 0;
    if(n && n.requires && n.requires.length){
      let maxOfGroups = 0;
      n.requires.forEach(group=>{
        let groupMax = 0;
        group.forEach(depId=>{
          if(nodesById[depId]) groupMax = Math.max(groupMax, getLayer(depId)+1);
        });
        maxOfGroups = Math.max(maxOfGroups, groupMax);
      });
      layer = maxOfGroups;
    }
    visiting.delete(id);
    layerCache[id] = layer;
    return layer;
  }
  data.nodes.forEach(n => getLayer(n.id));

  const maxLayer = Math.max(0, ...data.nodes.map(n=>layerCache[n.id]));
  const byLayer = {};
  data.nodes.forEach(n=>{
    const l = layerCache[n.id];
    (byLayer[l] = byLayer[l] || []).push(n.id);
  });

  let order = {};
  Object.keys(byLayer).forEach(l=>{
    byLayer[l].forEach((id,i)=> order[id]=i);
  });

  function barycenterPass(fromLowToHigh){
    const layers = Object.keys(byLayer).map(Number).sort((a,b)=> fromLowToHigh ? a-b : b-a);
    layers.forEach(l=>{
      const ids = byLayer[l];
      const scores = ids.map(id=>{
        const n = nodesById[id];
        let neighbors = [];
        if(fromLowToHigh){
          (n.requires||[]).forEach(g=> g.forEach(dep=>{ if(nodesById[dep]) neighbors.push(order[dep]); }));
        } else {
          data.nodes.forEach(other=>{
            (other.requires||[]).forEach(g=>{ if(g.includes(id)) neighbors.push(order[other.id]); });
          });
        }
        const avg = neighbors.length ? neighbors.reduce((a,b)=>a+b,0)/neighbors.length : (order[id]||0);
        return {id, avg};
      });
      scores.sort((a,b)=> a.avg - b.avg);
      byLayer[l] = scores.map(s=>s.id);
      byLayer[l].forEach((id,i)=> order[id]=i);
    });
  }
  barycenterPass(true);
  barycenterPass(false);
  barycenterPass(true);

  const baseRadius = 90;
  const ringGap = 118;
  const minArcPerNode = 46;
  const ringRadius = {};
  for(let l=0; l<=maxLayer; l++){
    const count = (byLayer[l] || []).length || 1;
    const neededByArc = (count * minArcPerNode) / (2*Math.PI);
    ringRadius[l] = Math.max(baseRadius + l*ringGap, l===0 ? baseRadius : (ringRadius[l-1]||baseRadius) + Math.max(ringGap, neededByArc*0.6));
  }

  const CENTER = CANVAS_SIZE/2;
  const result = {};
  data.nodes.forEach(n=>{
    const l = layerCache[n.id];
    const ids = byLayer[l];
    const idx = ids.indexOf(n.id);
    const count = ids.length;
    const r = (count === 1 && l === 0) ? 0 : ringRadius[l];
    const angle = (idx / count) * Math.PI * 2 - Math.PI/2;
    result[n.id] = { x: CENTER + r*Math.cos(angle), y: CENTER + r*Math.sin(angle) };
  });
  return result;
}

function autoLayoutPositions(forceAll){
  const auto = computeAutoPositions();
  data.nodes.forEach(n=>{
    if(forceAll || n.x === undefined || n.y === undefined || n.x === null || n.y === null){
      const p = auto[n.id];
      if(p){ n.x = p.x; n.y = p.y; }
    }
  });
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

let selectedEdge = null;   // {fromId, groupIndex, depId}
let draggingNodeId = null;
let connecting = null;     // {fromId, x, y}
let connectMouse = {x:0, y:0};
let vgroup = null;
let rafPending = false;

function scheduleRender(){
  if(rafPending) return;
  rafPending = true;
  requestAnimationFrame(()=>{ rafPending = false; render(); });
}

function screenToLocal(clientX, clientY){
  if(!vgroup) return {x:0,y:0};
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const ctm = vgroup.getScreenCTM();
  if(!ctm) return {x:0,y:0};
  const loc = pt.matrixTransform(ctm.inverse());
  return {x: loc.x, y: loc.y};
}

// ---------- 描画 ----------
function render(){
  svg.setAttribute('viewBox', `0 0 ${CANVAS_SIZE} ${CANVAS_SIZE}`);
  svg.innerHTML = '';

  const byId = {};
  data.nodes.forEach(n=> byId[n.id]=n);

  let litSet = null;
  if(selectedId){
    litSet = new Set([selectedId]);
    (function walkUp(id){
      const n = byId[id];
      if(!n) return;
      (n.requires||[]).forEach(g=> g.forEach(dep=>{
        if(!litSet.has(dep)){ litSet.add(dep); walkUp(dep); }
      }));
    })(selectedId);
    (function walkDown(id){
      data.nodes.forEach(n=>{
        (n.requires||[]).forEach(g=>{
          if(g.includes(id) && !litSet.has(n.id)){
            litSet.add(n.id);
            walkDown(n.id);
          }
        });
      });
    })(selectedId);
  }

  const root = document.createElementNS('http://www.w3.org/2000/svg','g');

  const edgeLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
  data.nodes.forEach(n=>{
    (n.requires||[]).forEach((group, gi)=>{
      const isOr = (n.requires.length > 1);
      group.forEach(depId=>{
        const dep = byId[depId];
        if(!dep || dep.x===undefined) return;
        const dx = n.x - dep.x, dy = n.y - dep.y;
        const dist = Math.max(1, Math.hypot(dx, dy));
        const ux = dx/dist, uy = dy/dist;
        const x1 = dep.x + ux*NODE_RADIUS, y1 = dep.y + uy*NODE_RADIUS;
        const x2 = n.x - ux*NODE_RADIUS, y2 = n.y - uy*NODE_RADIUS;
        const mx = (x1+x2)/2, my = (y1+y2)/2;
        const d = `M ${x1} ${y1} Q ${mx} ${my}, ${x2} ${y2}`;

        const isSelected = selectedEdge && selectedEdge.fromId===n.id && selectedEdge.groupIndex===gi && selectedEdge.depId===depId;

        const visible = document.createElementNS('http://www.w3.org/2000/svg','path');
        visible.setAttribute('d', d);
        let cls = 'edge' + (isOr ? ' or' : '');
        if(isSelected) cls += ' selected';
        else if(litSet) cls += (litSet.has(n.id) && litSet.has(depId)) ? ' lit' : ' dim';
        visible.setAttribute('class', cls);
        edgeLayer.appendChild(visible);

        const hit = document.createElementNS('http://www.w3.org/2000/svg','path');
        hit.setAttribute('d', d);
        hit.setAttribute('class', 'edge-hit');
        hit.addEventListener('click', (e)=>{ e.stopPropagation(); selectEdge(n.id, gi, depId); });
        edgeLayer.appendChild(hit);
      });
    });
  });
  root.appendChild(edgeLayer);

  const nodeLayer = document.createElementNS('http://www.w3.org/2000/svg','g');
  data.nodes.forEach(n=>{
    if(n.x===undefined || n.y===undefined) return;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    let cls = 'node';
    if(n.id === selectedId) cls += ' selected';
    if(litSet && !litSet.has(n.id)) cls += ' dim';
    g.setAttribute('class', cls);
    g.setAttribute('data-id', n.id);

    if(n.isGoal){
      const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
      ring.setAttribute('class','goal-ring');
      ring.setAttribute('cx', n.x); ring.setAttribute('cy', n.y); ring.setAttribute('r', NODE_RADIUS+7);
      g.appendChild(ring);
    }

    const halo = document.createElementNS('http://www.w3.org/2000/svg','circle');
    halo.setAttribute('class','halo');
    halo.setAttribute('cx', n.x); halo.setAttribute('cy', n.y); halo.setAttribute('r', NODE_RADIUS+5);
    halo.setAttribute('fill','none');
    halo.setAttribute('stroke','var(--text)');
    halo.setAttribute('stroke-width','1');
    g.appendChild(halo);

    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('class','node-circle');
    circle.setAttribute('cx', n.x); circle.setAttribute('cy', n.y); circle.setAttribute('r', NODE_RADIUS);
    const strokeVar = STATUS_COLOR_VAR[n.status] || '--locked';
    const fillVar = STATUS_FILL_VAR[n.status];
    circle.setAttribute('stroke', `var(${strokeVar})`);
    circle.setAttribute('fill', fillVar ? `var(${fillVar})` : 'var(--bg)');
    g.appendChild(circle);

    const title = document.createElementNS('http://www.w3.org/2000/svg','title');
    title.textContent = `${n.label}(${STATUS_LABEL[n.status]||n.status})`;
    g.appendChild(title);

    const showLabel = n.isGoal || n.status === 'wip' || (litSet && litSet.has(n.id));
    if(showLabel){
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('class','node-label');
      label.setAttribute('x', n.x); label.setAttribute('y', n.y + NODE_RADIUS + 20);
      label.textContent = n.label;
      g.appendChild(label);

      const sub = document.createElementNS('http://www.w3.org/2000/svg','text');
      sub.setAttribute('class','node-sub');
      sub.setAttribute('x', n.x); sub.setAttribute('y', n.y + NODE_RADIUS + 33);
      sub.textContent = STATUS_LABEL[n.status] || n.status;
      g.appendChild(sub);
    }

    g.addEventListener('mousedown', (e)=>{
      e.stopPropagation();
      if(e.shiftKey){
        connecting = { fromId: n.id, x: n.x, y: n.y };
        connectMouse = { x: n.x, y: n.y };
      } else {
        draggingNodeId = n.id;
      }
    });
    g.addEventListener('click', (e)=>{ e.stopPropagation(); selectNode(n.id); });
    nodeLayer.appendChild(g);
  });
  root.appendChild(nodeLayer);

  if(connecting){
    const preview = document.createElementNS('http://www.w3.org/2000/svg','path');
    preview.setAttribute('d', `M ${connecting.x} ${connecting.y} L ${connectMouse.x} ${connectMouse.y}`);
    preview.setAttribute('class','connect-preview');
    root.appendChild(preview);
  }

  svg.appendChild(root);
  vgroup = root;
  updateTransform();
}

function updateTransform(){
  if(!vgroup) return;
  vgroup.setAttribute('transform', `translate(${pan.x},${pan.y}) scale(${zoom})`);
}

function selectNode(id){
  selectedEdge = null;
  selectedId = id;
  render();
  renderPanel();
}

function selectEdge(fromId, groupIndex, depId){
  selectedId = null;
  selectedEdge = { fromId, groupIndex, depId };
  render();
  renderPanel();
}

function deleteNode(id){
  data.nodes = data.nodes.filter(n=>n.id!==id);
  data.nodes.forEach(n=>{
    n.requires = (n.requires||[]).map(g=> g.filter(d=>d!==id)).filter(g=>g.length>0);
  });
  if(selectedId===id) selectedId=null;
  saveData();
  render(); renderPanel();
}

function deleteEdge(fromId, groupIndex, depId){
  const n = data.nodes.find(x=>x.id===fromId);
  if(!n || !n.requires || !n.requires[groupIndex]) return;
  n.requires[groupIndex] = n.requires[groupIndex].filter(d=>d!==depId);
  n.requires = n.requires.filter(g=>g.length>0);
  saveData();
  render(); renderPanel();
}

function addRequirement(fromId, toId){
  if(fromId === toId) return;
  const n = data.nodes.find(x=>x.id===fromId);
  if(!n) return;
  n.requires = n.requires || [];
  const exists = n.requires.some(g=>g.includes(toId));
  if(exists) return;
  n.requires.push([toId]);
  saveData();
  render(); renderPanel();
}

function createNodeAt(x, y){
  const id = 'node_' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const newNode = { id, label:'新規ノード', status:'locked', requires:[], x, y };
  data.nodes.push(newNode);
  selectedEdge = null;
  selectedId = id;
  saveData();
  render(); renderPanel();
}

// ---------- パネル ----------
function renderPanel(){
  if(selectedEdge){
    const from = data.nodes.find(x=>x.id===selectedEdge.fromId);
    const dep = data.nodes.find(x=>x.id===selectedEdge.depId);
    panelContent.innerHTML = `
      <div><h2>関係</h2></div>
      <div class="req-group">
        <div style="font-size:13px;">${from ? escapeHtml(from.label) : '?'}</div>
        <div style="color:var(--text-faint); font-size:11px; margin:6px 0;">↑ 前提として必要</div>
        <div style="font-size:13px;">${dep ? escapeHtml(dep.label) : '?'}</div>
      </div>
      <button class="btn" id="delete-edge-btn" style="color:var(--danger); border-color:var(--danger);">この関係を削除</button>
    `;
    document.getElementById('delete-edge-btn').addEventListener('click', ()=>{
      deleteEdge(selectedEdge.fromId, selectedEdge.groupIndex, selectedEdge.depId);
      selectedEdge = null;
      render(); renderPanel();
    });
    return;
  }

  if(!selectedId){
    panelContent.innerHTML = `<div class="empty">
      ノードをクリックすると詳細が表示されます。<br><br>
      ・空白をクリック → ノード作成<br>
      ・ノードをドラッグ → 移動<br>
      ・Shift+ドラッグ → 別ノードへ関係作成<br>
      ・選択してDelete → 削除<br>
      ・Escape → 選択解除
    </div>`;
    return;
  }
  const n = data.nodes.find(x=>x.id===selectedId);
  if(!n){ panelContent.innerHTML=''; return; }

  const statusButtons = STATUS_ORDER.map(s=>{
    const active = s===n.status ? 'active' : '';
    return `<button class="status-btn ${active}" data-status="${s}">
      <span class="dot" style="border-color:var(${STATUS_COLOR_VAR[s]})"></span>${STATUS_LABEL[s]}
    </button>`;
  }).join('');

  let reqHtml = '';
  if(n.requires && n.requires.length){
    reqHtml = n.requires.map((group)=>{
      const items = group.map(depId=>{
        const dep = data.nodes.find(x=>x.id===depId);
        if(!dep) return '';
        return `<div class="req-item" data-jump="${depId}">
          <span class="dot" style="border-color:var(${STATUS_COLOR_VAR[dep.status]})"></span>${escapeHtml(dep.label)}
        </div>`;
      }).join('');
      return `<div class="req-group">
        ${n.requires.length>1 ? '<div class="or-label">OR いずれか</div>' : ''}
        ${items}
      </div>`;
    }).join('');
  } else {
    reqHtml = `<div class="empty" style="font-size:12px;">前提条件なし(出発点)</div>`;
  }

  const unlocks = data.nodes.filter(other => (other.requires||[]).some(g=>g.includes(n.id)));
  const unlocksHtml = unlocks.length
    ? unlocks.map(u=>`<div data-jump="${u.id}">→ ${escapeHtml(u.label)}</div>`).join('')
    : `<div style="color:var(--text-faint)">なし</div>`;

  panelContent.innerHTML = `
    <div>
      <input type="text" id="label-input" value="${escapeHtml(n.label)}">
      <div style="font-family:var(--mono); font-size:10px; color:var(--text-faint); margin-top:4px;">${n.id}</div>
    </div>
    <div>
      <div class="field-label">ステータス</div>
      <div class="status-grid">${statusButtons}</div>
    </div>
    <div>
      <button class="goal-toggle ${n.isGoal?'active':''}" id="goal-toggle-btn">
        ${n.isGoal ? '★ 最終到達点(ゴール)に指定中' : '☆ 最終到達点(ゴール)にする'}
      </button>
    </div>
    <div>
      <div class="field-label">前提条件</div>
      <div class="req-list">${reqHtml}</div>
    </div>
    <div>
      <div class="field-label">これが開ける先</div>
      <div class="unlocks-list">${unlocksHtml}</div>
    </div>
    <button class="btn" id="delete-node-btn" style="color:var(--danger); border-color:var(--danger);">このノードを削除</button>
  `;

  const labelInput = document.getElementById('label-input');
  labelInput.addEventListener('change', ()=>{
    n.label = labelInput.value.trim() || '(無題)';
    saveData();
    render(); renderPanel();
  });

  panelContent.querySelectorAll('.status-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      n.status = btn.getAttribute('data-status');
      saveData();
      render(); renderPanel();
    });
  });
  const goalBtn = panelContent.querySelector('#goal-toggle-btn');
  if(goalBtn) goalBtn.addEventListener('click', ()=>{
    n.isGoal = !n.isGoal;
    saveData();
    render(); renderPanel();
  });
  panelContent.querySelectorAll('[data-jump]').forEach(el=>{
    el.addEventListener('click', ()=> selectNode(el.getAttribute('data-jump')));
  });
  const delBtn = document.getElementById('delete-node-btn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(confirm(`「${n.label}」を削除しますか?`)) deleteNode(n.id);
  });
}

// ---------- パン・ズーム・ドラッグ・接続・作成 ----------
let panActive = false, panStart = {x:0,y:0}, panOrigin = {x:0,y:0};
let clickCandidate = null;

graphWrap.addEventListener('mousedown', (e)=>{
  if(e.target.closest && e.target.closest('.node')) return;
  panActive = true;
  graphWrap.classList.add('dragging');
  panStart = {x:e.clientX, y:e.clientY};
  panOrigin = {x:pan.x, y:pan.y};
  clickCandidate = {x:e.clientX, y:e.clientY};
});

window.addEventListener('mousemove', (e)=>{
  if(panActive){
    const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
    if(Math.hypot(dx,dy) > 4) clickCandidate = null;
    pan.x = panOrigin.x + dx;
    pan.y = panOrigin.y + dy;
    updateTransform();
  }
  if(draggingNodeId){
    const p = screenToLocal(e.clientX, e.clientY);
    const n = data.nodes.find(x=>x.id===draggingNodeId);
    if(n){ n.x = p.x; n.y = p.y; scheduleRender(); }
  }
  if(connecting){
    connectMouse = screenToLocal(e.clientX, e.clientY);
    scheduleRender();
  }
});

window.addEventListener('mouseup', (e)=>{
  if(panActive){
    panActive = false;
    graphWrap.classList.remove('dragging');
    if(clickCandidate){
      const p = screenToLocal(clickCandidate.x, clickCandidate.y);
      createNodeAt(p.x, p.y);
    }
    clickCandidate = null;
  }
  if(draggingNodeId){
    saveData();
    draggingNodeId = null;
  }
  if(connecting){
    const target = document.elementFromPoint(e.clientX, e.clientY);
    const nodeEl = target && target.closest && target.closest('.node');
    if(nodeEl){
      const targetId = nodeEl.getAttribute('data-id');
      if(targetId) addRequirement(connecting.fromId, targetId);
    }
    connecting = null;
    scheduleRender();
  }
});

graphWrap.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const delta = e.deltaY > 0 ? -0.08 : 0.08;
  zoom = Math.min(2.2, Math.max(0.35, zoom + delta));
  updateTransform();
}, { passive:false });

document.addEventListener('keydown', (e)=>{
  const tag = (e.target && e.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA') return;
  if(e.key === 'Escape'){
    selectedId = null; selectedEdge = null; connecting = null;
    render(); renderPanel();
  } else if(e.key === 'Delete' || e.key === 'Backspace'){
    if(selectedId){
      e.preventDefault();
      const n = data.nodes.find(x=>x.id===selectedId);
      if(n && confirm(`「${n.label}」を削除しますか?`)) deleteNode(selectedId);
    } else if(selectedEdge){
      e.preventDefault();
      deleteEdge(selectedEdge.fromId, selectedEdge.groupIndex, selectedEdge.depId);
      selectedEdge = null;
      render(); renderPanel();
    }
  }
});

// ---------- ツールバー ----------
document.getElementById('btn-reset').addEventListener('click', async ()=>{
  if(!confirm('例のデータにリセットします。よろしいですか?')) return;
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  autoLayoutPositions(false);
  selectedId = null; selectedEdge = null;
  saveData();
  render(); renderPanel();
});

document.getElementById('btn-recompute').addEventListener('click', ()=>{
  autoLayoutPositions(true);
  saveData();
  render(); renderPanel();
});

document.getElementById('btn-export').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `goal-network-${ts}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
});

const fileInput = document.getElementById('file-input');
document.getElementById('btn-import').addEventListener('click', ()=> fileInput.click());
fileInput.addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.nodes || !Array.isArray(parsed.nodes)) throw new Error('nodes 配列が必要です');
      data = parsed;
      autoLayoutPositions(false);
      selectedId = null; selectedEdge = null;
      saveData();
      render(); renderPanel();
    }catch(err){
      alert('読み込みエラー: ' + err.message);
    }
  };
  reader.readAsText(file);
  fileInput.value = '';
});

document.getElementById('btn-edit').addEventListener('click', ()=>{
  selectedId = null; selectedEdge = null;
  render();
  panelContent.innerHTML = `
    <div>
      <h2>データを編集</h2>
      <div style="font-size:11.5px; color:var(--text-faint); line-height:1.6; margin-top:4px;">
        requires は [[AND条件...], [AND条件...]] の形。外側配列が複数あればOR、内側の複数idはAND。x, y は座標(省略可、その場合は適用後に自動配置)。
      </div>
    </div>
    <textarea id="json-editor">${JSON.stringify(data, null, 2)}</textarea>
    <div id="json-msg"></div>
    <div id="edit-actions">
      <button class="btn" id="apply-json">適用</button>
      <button class="btn" id="cancel-json">閉じる</button>
    </div>
  `;
  document.getElementById('apply-json').addEventListener('click', ()=>{
    const msg = document.getElementById('json-msg');
    try{
      const parsed = JSON.parse(document.getElementById('json-editor').value);
      if(!parsed.nodes || !Array.isArray(parsed.nodes)) throw new Error('nodes 配列が必要です');
      data = parsed;
      autoLayoutPositions(false);
      saveData();
      render(); renderPanel();
    }catch(e){
      msg.textContent = 'エラー: ' + e.message;
      msg.classList.add('error');
    }
  });
  document.getElementById('cancel-json').addEventListener('click', ()=> renderPanel());
});

// ---------- 起動 ----------
(async function init(){
  await loadData();
  autoLayoutPositions(false);
  render();
  renderPanel();
})();

})();
</script>
</body>
</html>
