<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>到達ステータス・ネットワーク</title>
<link rel="stylesheet" href="goal-network.css">
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div id="title">STATUS NETWORK</div>
    <div class="spacer"></div>
    <input type="text" id="export-name-input" class="toolbar-input" placeholder="出力名" aria-label="出力名">
    <button class="btn" id="btn-import">読み込み↓</button>
    <button class="btn" id="btn-export">書き出し↑</button>
    <button class="btn" id="btn-edit">データを編集</button>
    <button class="btn" id="btn-reset">例をリセット</button>
    <button class="btn toggle-btn" id="btn-toggle-labels" type="button" aria-pressed="false">
      <span class="toggle-switch" aria-hidden="true"></span>
      <span class="toggle-label">ラベル: 省略</span>
    </button>
    <input type="file" id="file-input" accept="application/json,.json" style="display:none;">
  </div>
  <div id="graph-wrap">
    <svg id="graph-svg"></svg>
    <div id="legend">
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--locked); background:var(--locked-dim);"></span>未着手</div>
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--target); background:var(--target-dim);"></span>次に到達できる場所</div>
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--wip); background:var(--wip-dim);"></span>今取り組み中</div>
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--achieved); background:var(--achieved-dim);"></span>到達済み</div>
      <div class="legend-row"><span class="legend-dot" style="border-color:#111111; background:#111111;"></span>やらない</div>
      <div class="legend-row"><span class="legend-dot" style="border-color:var(--danger); background:#111111;"></span>問題が発生する</div>
      <div class="legend-row"><span class="legend-line"></span>AND(すべて必要)</div>
      <div class="legend-row"><span class="legend-line or"></span>OR(いずれかでよい)</div>
      <div style="height:1px; background:var(--panel-border); margin:2px 0;"></div>
      <div class="legend-row" style="font-family:var(--mono); font-size:10px;">空クリック:追加</div>
      <div class="legend-row" style="font-family:var(--mono); font-size:10px;">ドラッグ:移動</div>
      <div class="legend-row" style="font-family:var(--mono); font-size:10px;">Shift+ドラッグ:接続</div>
      <div class="legend-row" style="font-family:var(--mono); font-size:10px;">選択してDelete:削除</div>
    </div>
  </div>
  <div id="panel">
    <div id="panel-content">
      <div class="empty">ノードをクリックすると詳細が表示されます。ステータスの変更や、ゴール指定もここから行えます。</div>
    </div>
  </div>
</div>

<script src="goal-network.js"></script>
</body>
</html>
